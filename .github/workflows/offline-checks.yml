name: Offline source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python tools/check_release.py
      - run: python -m unittest discover -s tests -p 'test_configure*.py'
      - run: python -m unittest discover -s tests/bridge -p 'test_*.py'
      - run: python -m unittest discover -s tests/notifications -p 'test_*.py'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python worker/run_offline_tests.py
